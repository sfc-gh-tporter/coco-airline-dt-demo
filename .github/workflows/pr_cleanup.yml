name: CI cleanup

# Drops a PR's test schemas (AIRLINE_CI.PR_<n>_*) the moment the PR closes or merges, and
# runs a nightly sweeper for anything orphaned (no open PR, or older than 24h). Clones are
# zero-copy, but leftover clones pin prod micro-partitions and clutter the account -
# hygiene is part of the design, not an afterthought.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_ROLE: AIRLINE_CI_RL
      SNOWFLAKE_WAREHOUSE: AIRLINE_CI_WH
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Snowflake CLI + configure OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Drop this PR's environment
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/ci.py pr-cleanup --pr "${{ github.event.pull_request.number }}"

      - name: Sweep orphaned PR environments
        if: github.event_name != 'pull_request'
        run: python3 scripts/ci/ci.py sweep --max-age-hours 24

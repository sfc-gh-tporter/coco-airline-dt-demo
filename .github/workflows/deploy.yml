name: Deploy (prod)

# Production deploy after a PR merges to main.
#   - Gate:      the `prod` GitHub environment requires a reviewer approval before this job
#                can even request its OIDC token (the prod identity trusts environment:prod).
#   - Deploy:    apply the changed SQL; every statement carries QUERY_TAG
#                'gh:prod:<sha>:<run>:<file>'.
#   - Smoke:     health-check the deployed objects. On failure, new objects are dropped,
#                changed objects are re-applied from the `prod-last-good` tag, and the job fails.
#   - Record:    one row per step in AIRLINE_PROD.OPS.DEPLOY_LOG; move prod-last-good.
# Auth: OIDC only. SNOWFLAKE_ACCOUNT is the only secret.

on:
  push:
    branches: [main]
    paths:
      - "sql/**"
  workflow_dispatch:
    inputs:
      before:
        description: "Deploy files changed since this ref (default: prod-last-good)"
        required: false
        default: "prod-last-good"
      force_smoke_failure:
        description: "Rollback drill: fail the smoke test on purpose"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write   # move the prod-last-good tag after a healthy deploy

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_ROLE: PROD_GH_ACTIONS_DEPLOY_RL
      SNOWFLAKE_WAREHOUSE: AIRLINE_DEMO_WH
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout (history + tags for diff and rollback)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Snowflake CLI (OIDC)
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Who am I
        run: snow sql -x -q "SELECT CURRENT_USER() AS user, CURRENT_ROLE() AS role"

      - name: Deploy
        run: |
          BEFORE="${{ github.event_name == 'push' && github.event.before || inputs.before }}"
          python3 scripts/ci/ci.py deploy --before "$BEFORE" --after "${{ github.sha }}"

      - name: Smoke test
        run: python3 scripts/ci/ci.py smoke ${{ inputs.force_smoke_failure && '--force-failure' || '' }}

      - name: Record
        if: always()
        run: python3 scripts/ci/ci.py record
